name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Tests and Coverage
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg2://urluser:urlpassword@localhost:5432/urlshortener_test
      TEST_DATABASE_URL: postgresql+psycopg2://urluser:urlpassword@localhost:5432/urlshortener_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: urluser
          POSTGRES_PASSWORD: urlpassword
          POSTGRES_DB: urlshortener_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U urluser -d urlshortener_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install application dependencies
        run: |
          pip install -r requirements.txt

      - name: Install development dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run database migrations
        run: |
          alembic upgrade head

      - name: Run tests
        run: |
          pytest

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report
          path: htmlcov/