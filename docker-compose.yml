services: 
  postgres:
    image: postgres:16
    container_name: url_shortener_postgres
    environment:
      - POSTGRES_USER=urluser
      - POSTGRES_PASSWORD=urlpassword
      - POSTGRES_DB=urlshortener
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urluser -d urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: url_shortener_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api1:
    build: .
    container_name: url_shortener_api1

    expose:
        - "8000"

    environment:
        DATABASE_URL: "postgresql+psycopg2://urluser:urlpassword@postgres:5432/urlshortener"
        REDIS_URL: "redis://redis:6379/0"
        INSTANCE_NAME: "api1"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api2:
    build: .
    container_name: url_shortener_api2

    expose:
        - "8000"

    environment:
        DATABASE_URL: "postgresql+psycopg2://urluser:urlpassword@postgres:5432/urlshortener"
        REDIS_URL: "redis://redis:6379/0"
        INSTANCE_NAME: "api2"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: url_shortener_nginx

    ports:
      - "8000:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
volumes:
  postgres_data:

